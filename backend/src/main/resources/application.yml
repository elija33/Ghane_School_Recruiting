spring:
  application:
    name: gh-teacher-recruiting

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ghteacher}
    username: ${DATABASE_USERNAME:ghteacher}
    password: ${DATABASE_PASSWORD:ghteacher_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-base64}
    access-expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000     # 7 days

  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1:http://localhost:3000}
      - ${CORS_ALLOWED_ORIGIN_2:http://localhost:8081}
      - ${CORS_ALLOWED_ORIGIN_3:exp://localhost:8081}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}

prembly:
  api-key: ${PREMBLY_API_KEY}

etxng:
  api-key: ${ETXNG_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ghteacher.recruiting: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
